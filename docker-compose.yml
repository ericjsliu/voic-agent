version: '3.8'

services:
  # MQTT Broker (Mosquitto)
  mosquitto:
    image: docker.m.daocloud.io/eclipse-mosquitto:2.0
    container_name: cockpit_mqtt
    ports:
      - "1883:1883"
      - "19001:9001"  # 主机 9001 已被 kb-minio 占用，改映射到 19001
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - cockpit_network

  # Redis (optional, for memory store)
  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: cockpit_redis
    ports:
      - "6379:6379"
    networks:
      - cockpit_network
  
  postgres:
    image: ankane/pgvector:latest
    container_name: cockpit_postgres
    environment:
      POSTGRES_USER: cockpit
      POSTGRES_PASSWORD: cockpit
      POSTGRES_DB: cockpit_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cockpit_network

  # Mock Hybrid RAG Service (optional: docker compose --profile mock-rag up -d)
  mock_rag:
    profiles: ["mock-rag"]
    build:
      context: .
      dockerfile: Dockerfile.rag
    container_name: cockpit_mock_rag
    ports:
      - "8001:8001"
    environment:
      - RAG_SERVICE_PORT=8001
    networks:
      - cockpit_network
    command: python -m app.mock_rag.mock_rag_service

  # Smart Cockpit Agent (Cloud Side)
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cockpit_agent
    ports:
      - "8000:8000"
    environment:
      - AGENT_PORT=8000
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://cockpit:cockpit@postgres:5432/cockpit_agent
      - HYBRID_RAG_BASE_URL=${HYBRID_RAG_BASE_URL:-http://host.docker.internal:8001}
      - HYBRID_RAG_PATH=${HYBRID_RAG_PATH:-/query/hybrid_rerank}
      # LLM配置 (Alibaba DashScope OpenAI-compatible)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - LLM_DEFAULT_MODEL=${LLM_DEFAULT_MODEL:-qwen-turbo}
      - MEMORY_EXTRACT_MODEL=${MEMORY_EXTRACT_MODEL:-qwen-turbo}
      - MEMORY_EMBED_MODEL=${MEMORY_EMBED_MODEL:-text-embedding-v3}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS:-1024}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mosquitto
      - redis
      - postgres
    networks:
      - cockpit_network
    command: python -m app.main

  # Mock Vehicle (Vehicle Side - MOCK ONLY)
  mock_vehicle:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cockpit_mock_vehicle
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
    depends_on:
      - mosquitto
    networks:
      - cockpit_network
    command: python -m app.vehicle_mock.mock_vehicle

  # Web UI：宿主机 npm 构建后由 nginx 托管，避免拉取 node 镜像
  # 首次需执行：cd web && npm install && npm run build
  web:
    image: docker.m.daocloud.io/library/nginx:alpine
    container_name: cockpit_web_ui
    ports:
      - "3000:80"
    volumes:
      - ./web/dist:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - agent
    networks:
      - cockpit_network

networks:
  cockpit_network:
    driver: bridge

volumes:
  postgres_data:
