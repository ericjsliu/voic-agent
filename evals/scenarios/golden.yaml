  vehicle_model: model_a
  tags:
  - golden
  telemetry:
    gear: P
    speed_kmh: 0
  expect:
    domain: calendar
    action: query_events
    mqtt_exec_frames: 0
    forbid_domains:
    - chitchat
    cloud_success: text_zero_frame
- id: G-CAL2
  name: 查看今日行程
  utterance: 查看今日行程
  vehicle_model: model_a
  tags:
  - golden
  telemetry:
    gear: P
    speed_kmh: 0
  expect:
    domain: calendar
    action: query_events
    mqtt_exec_frames: 0
    forbid_domains:
    - chitchat
    cloud_success: text_zero_frame
- id: G-V0-1
  name: 打开空调
  utterance: 打开空调
  vehicle_model: model_a
  tags:
  - golden
  telemetry:
    gear: P
    speed_kmh: 0
  expect:
    domain: vehicle
    action: ac_power
    level: L0
    mqtt_exec_frames: 1
    cloud_success: dispatch_intent
- id: G-V0-2
  name: 空调调到22度
  utterance: 空调调到22度
  vehicle_model: model_a
  tags:
  - golden
  telemetry:
    gear: P
    speed_kmh: 0
  expect:
    domain: vehicle
    action: set_ac_temp
    level: L0
    temperature: 22
    mqtt_exec_frames: 1
    cloud_success: dispatch_intent
- id: G-V1-P
  name: 打开车窗-P
  utterance: 打开车窗
  vehicle_model: model_a
  tags:
  - golden
  telemetry:
    gear: P
    speed_kmh: 0
  expect:
    domain: vehicle
    action: window_open
    level: L1
    mqtt_exec_frames: 1
    cloud_success: dispatch_intent
- id: G-V1-D
  name: 打开车窗-非P
  utterance: 打开车窗
  vehicle_model: model_a
  tags:
  - golden
  - vehicle_side_ref
  telemetry:
    gear: D
    speed_kmh: 30
  expect:
    domain: vehicle
    action: window_open
    level: L1
    mqtt_exec_frames: 1
    cloud_success: dispatch_intent
    vehicle_ack_ref: rejected
    exclude_vehicle_ack_from_cloud_denominator: true
- id: G-V2
  name: 锁车-L2
  utterance: 锁车
  vehicle_model: model_a
  tags:
  - golden
  telemetry:
    gear: P
    speed_kmh: 0
  expect:
    domain: vehicle
    action: door_lock
    level: L2
    has_l2: true
    mqtt_before_confirm: 0
    mqtt_exec_frames: 0
    cloud_success: plan_l2_wait_confirm
- id: G-MIX1
  name: 开窗同时放歌
  utterance: 打开车窗，同时播放音乐
  vehicle_model: model_a
  tags:
  - golden
  - mixed
  telemetry:
    gear: P
    speed_kmh: 0
  expect:
    multi_intent: true
    domains_all:
    - vehicle
    - media
    mqtt_exec_frames_min: 2
    forbid_pure_chitchat: true
    cloud_success: multi_step_dispatch
- id: G-N1
  name: 导航到机场
  utterance: 导航到机场
  vehicle_model: model_a
  tags:
  - golden
  telemetry:
    gear: P
    speed_kmh: 0
  expect:
    domain: navigation
    action: set_nav_goal
    confirm: none
    mqtt_exec_frames: 1
    resolve: poi
    poi_hint: 机场
    success_signal_ref: nav_route_started
    cloud_success: dispatch_nav_goal
- id: G-N2
  name: 导航回家
  utterance: 导航回家
  vehicle_model: model_a
  tags:
  - golden
  telemetry:
