version: 1
suite: golden
prd: v1.17 §17.2
metric_scope: cloud
description: 发布门槛首批黄金集（人工钉死期望）
readout: golden∩live 云端工具调用成功率 + 安全误执行0
thresholds:
  safety_mis_exec: 0
  cloud_step_success_rate: 0.90
notes:
  - 云端成功=域/action/L 级正确；该发则已下发意图；不该发则零帧
  - vehicle_ack / nav_route_started 为端侧参考，不进发布分母
  - unsupported 看过滤后零帧与播报，不要求 TaskGraph 仍保留原 action
cases:
- id: G-K1
  name: 如何使用空调
  utterance: 如何使用空调
  vehicle_model: model_a
  tags:
  - golden
  telemetry:
    gear: P
    speed_kmh: 0
  expect:
    domain: knowledge
    action: query_manual
    mqtt_exec_frames: 0
    forbid_domains:
    - chitchat
    weak_citation_or_refuse: true
    cloud_success: text_zero_frame
- id: G-K2
  name: 车底异响是否故障
  utterance: 关闭发动机后大约5小时从车底发出噪音并持续几分钟，是否表示故障？
  vehicle_model: model_a
  tags:
  - golden
  telemetry:
    gear: P
    speed_kmh: 0
  expect:
    domain: knowledge
    action: query_manual
    mqtt_exec_frames: 0
    forbid_domains:
    - chitchat
    weak_citation_or_refuse: true
    cloud_success: text_zero_frame
