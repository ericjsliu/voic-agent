  name: 我想听个笑话
  utterance: 我想听个笑话
  vehicle_model: model_a
  tags:
  - golden
  telemetry:
    gear: P
    speed_kmh: 0
  expect:
    domain: chitchat
    mqtt_exec_frames: 0
    forbid_empty_ack: true
    response_min_chars: 10
    cloud_success: text_zero_frame
- id: G-CAL1
  name: 查询今天的日程
