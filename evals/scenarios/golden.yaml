- id: G-BL1
  name: 打开天窗-ModelA不支持
  utterance: 打开天窗
  vehicle_model: model_a
  tags:
  - golden
  - unsupported
  telemetry:
    gear: P
    speed_kmh: 0
  expect:
    intent_action: sunroof_open
    mqtt_exec_frames: 0
    expect_outcome: unsupported_or_blacklist
    forbid_success_dispatch: true
    allow_chitchat_notice: true
    cloud_success: zero_frame
