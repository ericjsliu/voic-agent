version: 1
suite: full_vehicle
metric_scope: cloud
description: 测试台 vehicle 域芯片全量场景（PRD v1.15 云端五类指标）
cases:
- id: UI-VEH-01
  name: 打开车窗
  utterance: 打开车窗
  vehicle_model: model_a
  source: ui_chip
  expect:
    domain: vehicle
    action: window_open
    level: L1
    mqtt_exec_frames: 1
    note: cloud_dispatch_ok; vehicle_ack is联调参考
  telemetry:
    gear: P
    speed_kmh: 0
- id: UI-VEH-02
  name: 关闭车窗
  utterance: 关闭车窗
  vehicle_model: model_a
  source: ui_chip
  expect:
    domain: vehicle
    action: window_close
    level: L1
    mqtt_exec_frames: 1
    note: cloud_dispatch_ok; vehicle_ack is联调参考
  telemetry:
    gear: P
    speed_kmh: 0
- id: UI-VEH-03
  name: 打开天窗
  utterance: 打开天窗
  vehicle_model: model_a
  source: ui_chip
  expect:
    domain: vehicle
    action: sunroof_open
    mqtt_exec_frames: 0
    expect_outcome: unsupported_or_blacklist
    forbid_success_dispatch: true
  telemetry:
    gear: P
    speed_kmh: 0
- id: UI-VEH-04
  name: 关闭天窗
  utterance: 关闭天窗
