  vehicle_model: model_a
  source: safety_companion
  telemetry:
    gear: D
    speed_kmh: 30
  expect:
    domain: vehicle
    action: window_open
    level: L1
    note: 云端可下发；端侧 rejected 为联调/安全断言，不进云端成功分母
    mqtt_exec_frames: 1
