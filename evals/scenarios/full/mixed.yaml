version: 1
suite: full_mixed
metric_scope: cloud
description: 测试台混合意图句（非纯闲聊）
cases:
- id: UI-CHI-05
  name: 打开车窗，同时播放音乐
  utterance: 打开车窗，同时播放音乐
  vehicle_model: model_a
  source: ui_mixed
  expect:
    domains_any:
    - vehicle
    - media
    multi_intent: true
    mqtt_exec_frames_min: 1
