version: 1
suite: full_navigation
metric_scope: cloud
description: 测试台 navigation 域芯片全量场景（PRD v1.15 云端五类指标）
cases:
- id: UI-NAV-01
  name: 导航到机场
  utterance: 导航到机场
  vehicle_model: model_a
  source: ui_chip
  expect:
    domain: navigation
    action: set_nav_goal
    mqtt_exec_frames: 1
    success_signal: nav_route_started
    confirm: none
    resolve: poi_or_default
  telemetry:
    gear: P
    speed_kmh: 0
- id: UI-NAV-02
  name: 导航到公司
  utterance: 导航到公司
  vehicle_model: model_a
  source: ui_chip
  expect:
    domain: navigation
    action: set_nav_goal
    mqtt_exec_frames: 1
    success_signal: nav_route_started
    confirm: none
    resolve: poi_or_default
  telemetry:
    gear: P
    speed_kmh: 0
- id: UI-NAV-03
  name: 导航回家
  utterance: 导航回家
  vehicle_model: model_a
  source: ui_chip
  expect:
    domain: navigation
    action: set_nav_goal
    mqtt_exec_frames: 1
    success_signal: nav_route_started
    confirm: none
    resolve: poi_or_default
  telemetry:
