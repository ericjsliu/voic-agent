  name: 播放音乐
  utterance: 播放音乐
  vehicle_model: model_a
  source: ui_chip
  expect:
    domain: media
    action: media_play
    mqtt_exec_frames: 1
    level: L0
  telemetry:
    gear: P
    speed_kmh: 0
